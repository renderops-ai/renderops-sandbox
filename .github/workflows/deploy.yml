name: Deploy

# Deploys are automated, per-server, on every push to main:
#   Control plane -> built as a Docker image, pushed to GHCR, then a SELF-HOSTED
#     runner on the basic server runs `docker compose pull && up -d`. No source
#     or Go toolchain on the box; it only pulls the image.
#   Orchestrator -> built as a private internal image and pulled by a dedicated
#     SELF-HOSTED runner. It binds only to the server's private IP; no Caddy.
#   Worker -> GitHub SSHes into the bare-metal host with a key held as a secret
#     and installs the binary (Firecracker can't be containerized).
# Path filters keep all three independently deployable.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which server to deploy"
        default: "all"
        type: choice
        options: [all, control-plane, orchestrator, worker, worker-1, worker-2]
      rebuild_rootfs:
        description: "Build and roll out a new guest-agent rootfs"
        default: false
        type: boolean
      deploy_kernel:
        description: "Roll out the guest kernel pinned in ops/worker/kernel.lock"
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTROL_PLANE_IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane
  CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/caddy-cloudflare
  ORCHESTRATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/orchestrator

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      control_plane: ${{ steps.filter.outputs.control_plane }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      worker: ${{ steps.filter.outputs.worker }}
      rootfs: ${{ steps.filter.outputs.rootfs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            control_plane:
              - 'backend/internal/agentsession/**'
              - 'backend/internal/executor/**'
              - 'backend/internal/gitworkspace/**'
              - 'backend/internal/modelaccess/**'
              - 'backend/internal/modelrelay/**'
              - 'backend/internal/rpc/**'
              - 'backend/internal/sandboxfiles/**'
              - 'backend/internal/sandboximage/**'
              - 'backend/internal/secrets/**'
              - 'backend/internal/terminal/**'
              - 'backend/cmd/control-plane/**'
              - 'backend/cmd/preview-gateway/**'
              - 'backend/internal/controlplane/**'
              - 'backend/internal/logstream/**'
              - 'backend/internal/handler/**'
              - 'backend/internal/ide/**'
              - 'backend/internal/ideauth/**'
              - 'backend/internal/orchestrator/**'
              - 'backend/internal/agent/**'
              - 'backend/internal/plane/**'
              - 'backend/internal/platform/**'
              - 'backend/internal/metering/**'
              - 'backend/internal/middleware/**'
              - 'backend/internal/policy/**'
              - 'backend/internal/preview/**'
              - 'backend/internal/previewgateway/**'
              - 'backend/internal/billing/**'
              - 'backend/internal/vmsize/**'
              - 'backend/Dockerfile.controlplane'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'ops/control-plane/**'
            orchestrator:
              - 'backend/internal/agent/**'
              - 'backend/internal/billing/**'
              - 'backend/internal/logstream/**'
              - 'backend/internal/metering/**'
              - 'backend/internal/plane/**'
              - 'backend/internal/policy/**'
              - 'backend/internal/rpc/**'
              - 'backend/internal/sandboximage/**'
              - 'backend/internal/terminal/**'
              - 'backend/cmd/orchestrator/**'
              - 'backend/internal/orchestrator/**'
              - 'backend/internal/platform/**'
              - 'backend/Dockerfile.orchestrator'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'ops/orchestrator/**'
            worker:
              - 'backend/internal/gitproxy/**'
              - 'backend/internal/modelproxy/**'
              - 'backend/internal/rpc/**'
              - 'backend/internal/sandboximage/**'
              - 'backend/internal/slotnet/**'
              - 'backend/internal/terminal/**'
              - 'backend/internal/writabledisk/**'
              - 'backend/cmd/worker/**'
              - 'backend/internal/executor/**'
              - 'backend/internal/ide/**'
              - 'backend/internal/session/**'
              - 'backend/internal/metering/**'
              - 'backend/internal/worker/**'
              - 'backend/internal/logagent/**'
              - 'backend/internal/logstream/**'
              - 'backend/internal/bootstrap/**'
              - 'backend/internal/cgroup/**'
              - 'backend/internal/checkpoint/**'
              - 'backend/internal/template/**'
              - 'backend/internal/vmsize/**'
              - 'backend/internal/workerplane/**'
              - 'backend/internal/orchestrator/**'
              - 'backend/internal/plane/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'ops/worker/**'
              - 'guest-agent/**'
              - 'Dockerfile.rootfs'
            rootfs:
              - 'guest-agent/**'
              - 'Dockerfile.rootfs'

  # ---- CONTROL PLANE: build image on GitHub -> GHCR -> compose pull on the box ----

  build-control-plane-image:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'control-plane')
      || github.event_name == 'push' && needs.changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.controlplane
          push: true
          tags: |
            ${{ env.CONTROL_PLANE_IMAGE }}:latest
            ${{ env.CONTROL_PLANE_IMAGE }}:${{ github.sha }}
      - name: Build and push Caddy with Cloudflare DNS support
        uses: docker/build-push-action@v6
        with:
          context: ./ops/control-plane
          file: ./ops/control-plane/Dockerfile.caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ github.sha }}

  # Runs ON the basic server via the self-hosted runner (label: control-plane).
  # Pulls the freshly-pushed image and recreates ONLY the control-plane service.
  deploy-control-plane:
    needs: build-control-plane-image
    runs-on: [self-hosted, control-plane]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Synchronize and deploy control-plane
        run: |
          flock /opt/renderops/.deploy.lock bash -euc '
            cp ops/control-plane/docker-compose.yml /opt/renderops/docker-compose.yml
            cp ops/control-plane/Caddyfile /opt/renderops/Caddyfile
            cd /opt/renderops
            docker compose config --quiet
            docker compose pull control-plane preview-gateway caddy
            # Include postgres so private bind/health configuration changes are
            # actually applied. Its named volume preserves database contents.
            docker compose up -d postgres control-plane preview-gateway caddy
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
          '
      - name: Health check
        working-directory: /opt/renderops
        run: |
          for i in $(seq 1 20); do
            if docker compose exec -T control-plane wget -qO- http://127.0.0.1:8081/health >/dev/null 2>&1 \
              && docker compose exec -T preview-gateway wget -qO- http://127.0.0.1:8082/health >/dev/null 2>&1; then
              echo "control-plane and preview-gateway healthy after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "control-plane stack did not become healthy:"
          docker compose logs --tail=40 control-plane || true
          docker compose logs --tail=40 preview-gateway || true
          docker compose logs --tail=40 caddy || true
          exit 1

  # ---- ORCHESTRATOR: multi-arch image -> GHCR -> dedicated private server ----

  build-orchestrator-image:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'orchestrator')
      || github.event_name == 'push' && needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.orchestrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ORCHESTRATOR_IMAGE }}:latest
            ${{ env.ORCHESTRATOR_IMAGE }}:${{ github.sha }}

  deploy-orchestrator:
    needs: build-orchestrator-image
    if: vars.ORCHESTRATOR_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, orchestrator]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Synchronize and deploy orchestrator
        run: |
          flock /opt/renderops-orchestrator/.deploy.lock bash -euc '
            cp ops/orchestrator/docker-compose.yml /opt/renderops-orchestrator/docker-compose.yml
            cd /opt/renderops-orchestrator
            image="${{ env.ORCHESTRATOR_IMAGE }}:${{ github.sha }}"
            cpu_overcommit="${{ vars.ORCHESTRATOR_CPU_OVERCOMMIT_RATIO || '2' }}"
            test -f .env
            test -w .env
            test -n "${cpu_overcommit}"
            case "${cpu_overcommit}" in
              *[!0-9.]*|*.*.*)
                echo "invalid ORCHESTRATOR_CPU_OVERCOMMIT_RATIO: ${cpu_overcommit}" >&2
                exit 1
                ;;
            esac
            if grep -q "^ORCHESTRATOR_IMAGE=" .env; then
              sed -i "s|^ORCHESTRATOR_IMAGE=.*|ORCHESTRATOR_IMAGE=${image}|" .env
            else
              printf "\nORCHESTRATOR_IMAGE=%s\n" "${image}" >> .env
            fi
            if grep -q "^ORCHESTRATOR_CPU_OVERCOMMIT_RATIO=" .env; then
              sed -i "s|^ORCHESTRATOR_CPU_OVERCOMMIT_RATIO=.*|ORCHESTRATOR_CPU_OVERCOMMIT_RATIO=${cpu_overcommit}|" .env
            else
              printf "ORCHESTRATOR_CPU_OVERCOMMIT_RATIO=%s\n" "${cpu_overcommit}" >> .env
            fi
            export ORCHESTRATOR_IMAGE="${image}"
            export ORCHESTRATOR_CPU_OVERCOMMIT_RATIO="${cpu_overcommit}"
            docker compose config --quiet
            docker compose pull orchestrator
            docker compose up -d orchestrator
          '
      - name: Health check
        working-directory: /opt/renderops-orchestrator
        run: |
          for i in $(seq 1 20); do
            if docker compose exec -T orchestrator wget -qO- http://127.0.0.1:8090/health >/dev/null 2>&1; then
              echo "orchestrator healthy after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "orchestrator did not become healthy:"
          docker compose logs --tail=40 orchestrator || true
          exit 1

  # ---- WORKERS: build once -> rolling SSH deploy across bare-metal hosts ----

  build-worker:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'worker' || inputs.target == 'worker-1' || inputs.target == 'worker-2')
      || github.event_name == 'push' && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rootfs_changed: ${{ steps.rootfs.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build worker (linux/amd64)
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/renderops-worker ./cmd/worker
      - name: Decide whether to build rootfs
        id: rootfs
        env:
          PATH_CHANGED: ${{ needs.changes.outputs.rootfs }}
          MANUAL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_rootfs || false }}
        run: |
          if [ "$PATH_CHANGED" = "true" ] || [ "$MANUAL_REBUILD" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build versioned guest rootfs
        if: steps.rootfs.outputs.changed == 'true'
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile.rootfs \
            --target rootfs-export \
            --output type=local,dest=/tmp/renderops-rootfs-build \
            .
          mkdir -p /tmp/renderops-rootfs-artifact
          sha256sum /tmp/renderops-rootfs-build/rootfs-alpine.ext4 \
            > /tmp/renderops-rootfs-artifact/rootfs-alpine.ext4.sha256
          tar --sparse -C /tmp/renderops-rootfs-build -czf \
            /tmp/renderops-rootfs-artifact/rootfs-alpine.ext4.tar.gz \
            rootfs-alpine.ext4
        working-directory: .
      - name: Upload versioned guest rootfs
        if: steps.rootfs.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: renderops-rootfs-${{ github.sha }}
          path: /tmp/renderops-rootfs-artifact
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload worker binary
        uses: actions/upload-artifact@v4
        with:
          name: renderops-worker-${{ github.sha }}
          path: /tmp/renderops-worker
          if-no-files-found: error
          retention-days: 1

  deploy-worker-1:
    needs: build-worker
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'worker' || inputs.target == 'worker-1')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download worker binary
        uses: actions/download-artifact@v4
        with:
          name: renderops-worker-${{ github.sha }}
          path: /tmp/renderops-worker-artifact
      - name: Download guest rootfs
        if: needs.build-worker.outputs.rootfs_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: renderops-rootfs-${{ github.sha }}
          path: /tmp/renderops-rootfs-artifact
      - name: Download pinned guest kernel
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_kernel
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.BLOB_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.BLOB_SECRET_KEY }}
          BLOB_CONTAINER_NAME: ${{ secrets.BLOB_CONTAINER_NAME }}
        run: bash ops/worker/fetch-kernel.sh /tmp/renderops-kernel-artifact
      - name: Deploy worker 1
        run: |
          args=()
          if [ -f /tmp/renderops-rootfs-artifact/rootfs-alpine.ext4.tar.gz ]; then
            args=(
              /tmp/renderops-rootfs-artifact/rootfs-alpine.ext4.tar.gz
              /tmp/renderops-rootfs-artifact/rootfs-alpine.ext4.sha256
            )
          fi
          if [ -f /tmp/renderops-kernel-artifact/vmlinux ]; then
            export KERNEL_FILE=/tmp/renderops-kernel-artifact/vmlinux
            export KERNEL_RELEASE="$(sed -n 's/^KERNEL_RELEASE=//p' ops/worker/kernel.lock)"
            export KERNEL_SHA256="$(sed -n 's/^KERNEL_SHA256=//p' ops/worker/kernel.lock)"
          fi
          WORKER_IMAGES="$(awk '!/^#/ && NF == 3 { printf "%s%s=%s@%s", sep, $1, $2, $3; sep = "," }' ops/worker/images.lock)"
          export WORKER_IMAGES
          bash ops/worker/install.sh /tmp/renderops-worker-artifact/renderops-worker "${args[@]}"
        env:
          SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          SSH_HOST: ${{ secrets.WORKER_HOST }}
          SSH_USER: ${{ secrets.WORKER_USER }}
          WORKER_MAX_SESSIONS: ${{ vars.WORKER_MAX_SESSIONS || '200' }}
          WORKER_CPU_OVERCOMMIT_RATIO: ${{ vars.WORKER_CPU_OVERCOMMIT_RATIO || '2' }}
          WORKER_MEMORY_OVERCOMMIT_RATIO: ${{ vars.ORCHESTRATOR_MEMORY_OVERCOMMIT_RATIO || '1' }}
          WORKER_MAX_TERMINALS_PER_SANDBOX: ${{ vars.WORKER_MAX_TERMINALS_PER_SANDBOX || '8' }}
          CONTROL_PLANE_INTERNAL_URL: ${{ vars.CONTROL_PLANE_INTERNAL_URL || 'https://dev-api.renderops.com' }}
          BLOB_STORAGE_ACCOUNT: ${{ secrets.BLOB_STORAGE_ACCOUNT }}
          BLOB_CONTAINER_NAME: ${{ secrets.BLOB_CONTAINER_NAME }}
          BLOB_SECRET_KEY: ${{ secrets.BLOB_SECRET_KEY }}
          ROOTFS_VERSION: ${{ github.sha }}

  # Wait for worker 1's health check before touching worker 2. A manual
  # worker-2-only dispatch is allowed to bypass the intentionally skipped first job.
  deploy-worker-2:
    needs: [build-worker, deploy-worker-1]
    if: >-
      always()
      && needs.build-worker.result == 'success'
      && (needs.deploy-worker-1.result == 'success' || needs.deploy-worker-1.result == 'skipped')
      && (
        github.event_name == 'push'
        || github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'worker' || inputs.target == 'worker-2')
      )
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download worker binary
        uses: actions/download-artifact@v4
        with:
          name: renderops-worker-${{ github.sha }}
          path: /tmp/renderops-worker-artifact
      - name: Download guest rootfs
        if: needs.build-worker.outputs.rootfs_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: renderops-rootfs-${{ github.sha }}
          path: /tmp/renderops-rootfs-artifact
      - name: Download pinned guest kernel
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_kernel
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.BLOB_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.BLOB_SECRET_KEY }}
          BLOB_CONTAINER_NAME: ${{ secrets.BLOB_CONTAINER_NAME }}
        run: bash ops/worker/fetch-kernel.sh /tmp/renderops-kernel-artifact
      - name: Deploy worker 2
        run: |
          args=()
          if [ -f /tmp/renderops-rootfs-artifact/rootfs-alpine.ext4.tar.gz ]; then
            args=(
              /tmp/renderops-rootfs-artifact/rootfs-alpine.ext4.tar.gz
              /tmp/renderops-rootfs-artifact/rootfs-alpine.ext4.sha256
            )
          fi
          if [ -f /tmp/renderops-kernel-artifact/vmlinux ]; then
            export KERNEL_FILE=/tmp/renderops-kernel-artifact/vmlinux
            export KERNEL_RELEASE="$(sed -n 's/^KERNEL_RELEASE=//p' ops/worker/kernel.lock)"
            export KERNEL_SHA256="$(sed -n 's/^KERNEL_SHA256=//p' ops/worker/kernel.lock)"
          fi
          WORKER_IMAGES="$(awk '!/^#/ && NF == 3 { printf "%s%s=%s@%s", sep, $1, $2, $3; sep = "," }' ops/worker/images.lock)"
          export WORKER_IMAGES
          bash ops/worker/install.sh /tmp/renderops-worker-artifact/renderops-worker "${args[@]}"
        env:
          SSH_KEY: ${{ secrets.WORKER_2_SSH_KEY }}
          SSH_HOST: ${{ secrets.WORKER_2_HOST }}
          SSH_USER: ${{ secrets.WORKER_2_USER }}
          WORKER_MAX_SESSIONS: ${{ vars.WORKER_MAX_SESSIONS || '200' }}
          WORKER_CPU_OVERCOMMIT_RATIO: ${{ vars.WORKER_CPU_OVERCOMMIT_RATIO || '2' }}
          WORKER_MEMORY_OVERCOMMIT_RATIO: ${{ vars.ORCHESTRATOR_MEMORY_OVERCOMMIT_RATIO || '1' }}
          WORKER_MAX_TERMINALS_PER_SANDBOX: ${{ vars.WORKER_MAX_TERMINALS_PER_SANDBOX || '8' }}
          CONTROL_PLANE_INTERNAL_URL: ${{ vars.CONTROL_PLANE_INTERNAL_URL || 'https://dev-api.renderops.com' }}
          BLOB_STORAGE_ACCOUNT: ${{ secrets.BLOB_STORAGE_ACCOUNT }}
          BLOB_CONTAINER_NAME: ${{ secrets.BLOB_CONTAINER_NAME }}
          BLOB_SECRET_KEY: ${{ secrets.BLOB_SECRET_KEY }}
          ROOTFS_VERSION: ${{ github.sha }}
