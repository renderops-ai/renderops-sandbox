name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend (control-plane + orchestrator + worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build control plane
        run: go build -o /tmp/renderops-control-plane ./cmd/control-plane

      - name: Build preview gateway
        run: go build -o /tmp/renderops-preview-gateway ./cmd/preview-gateway

      - name: Build worker
        run: go build -o /tmp/renderops-worker ./cmd/worker

      - name: Build orchestrator
        run: go build -o /tmp/renderops-orchestrator ./cmd/orchestrator

      - name: Build orchestrator image
        run: docker build -f Dockerfile.orchestrator -t renderops-orchestrator:ci .

      - name: Run tests
        run: go test ./...

      - name: Check deploy path filters cover each service's packages
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-deploy-filters.sh

      - name: Test worker rootfs and kernel activation
        working-directory: ${{ github.workspace }}
        run: |
          bash ops/worker/tests/activate-rootfs_test.sh
          bash ops/worker/tests/activate-kernel_test.sh

  guest-agent:
    name: Guest Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: guest-agent/go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build and test (linux target)
        run: GOOS=linux GOARCH=amd64 go test ./...
