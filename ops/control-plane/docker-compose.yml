# RenderOps control-plane stack: API, dashboard, Caddy, and the development DB.
# Lives at /opt/renderops/docker-compose.yml on the box. CI pushes images to GHCR;
# the box only pulls (no source/toolchain on the box).
#
# Secrets come from /opt/renderops/.env (see .env.example). The control-plane
# tunnel key lives at /opt/renderops/keys/ and is mounted read-only.
name: renderops

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: renderops
      POSTGRES_USER: renderops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    # Publish Postgres on this host's PRIVATE vnet IP only (never 0.0.0.0), so the
    # orchestrator on 10.0.0.7 can reach it over the vnet. Access is scoped down by
    # the NSG (source 10.0.0.7/32 -> 5432) and pg_hba. Override the bind IP per host
    # via POSTGRES_BIND_IP in /opt/renderops/.env.
    ports:
      - "${POSTGRES_BIND_IP:-10.0.0.5}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderops -d renderops"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  control-plane:
    # Built + pushed by CI (renderops-sandbox). The box only pulls this image.
    image: ghcr.io/renderops-ai/control-plane:latest
    restart: unless-stopped
    environment:
      PORT: "8081"
      DATABASE_URL: postgresql://renderops:${POSTGRES_PASSWORD}@postgres:5432/renderops?sslmode=disable
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:?ORCHESTRATOR_URL is required}
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?ORCHESTRATOR_TOKEN is required}
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN is required}
      TERMINAL_ALLOWED_ORIGINS: ${TERMINAL_ALLOWED_ORIGINS:-dev.renderops.com}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-dev-sandbox.renderops.com}
      # Decrypts saved model provider credentials for the model relay; same value
      # as the platform's. Unset disables model access for agent sessions.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # Agent-session runner (claims sessions from the platform and runs Claude
      # Code in their sandboxes). Off unless AGENT_RUNNER_ENABLED=true; then
      # AGENT_WORKER_TOKEN (the platform's value) and SECRETS_ENCRYPTION_KEY are
      # required. Empty values use the defaults: PLATFORM_INTERNAL_URL
      # http://platform:3000, concurrency 4, turn timeout 45m.
      AGENT_RUNNER_ENABLED: ${AGENT_RUNNER_ENABLED:-}
      PLATFORM_INTERNAL_URL: ${PLATFORM_INTERNAL_URL:-}
      AGENT_WORKER_TOKEN: ${AGENT_WORKER_TOKEN:-}
      AGENT_RUNNER_CONCURRENCY: ${AGENT_RUNNER_CONCURRENCY:-}
      AGENT_TURN_TIMEOUT: ${AGENT_TURN_TIMEOUT:-}
      # CLI folder uploads: off unless UPLOADS_CONTAINER_NAME is set; then the
      # uploads-only storage account and its key are required (never the
      # workers' checkpoint account). Empty UPLOADS_MAX_BYTES means 500 MiB.
      UPLOADS_CONTAINER_NAME: ${UPLOADS_CONTAINER_NAME:-}
      UPLOADS_BLOB_ACCOUNT: ${UPLOADS_BLOB_ACCOUNT:-}
      UPLOADS_BLOB_KEY: ${UPLOADS_BLOB_KEY:-}
      UPLOADS_MAX_BYTES: ${UPLOADS_MAX_BYTES:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  preview-gateway:
    image: ghcr.io/renderops-ai/control-plane:latest
    entrypoint: ["preview-gateway"]
    restart: unless-stopped
    environment:
      PORT: "8082"
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-dev-sandbox.renderops.com}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:?ORCHESTRATOR_URL is required}
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?ORCHESTRATOR_TOKEN is required}
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN is required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  platform:
    # Built + pushed by CI (renderops-platform). The box only pulls this image.
    image: ghcr.io/renderops-ai/platform:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://renderops:${POSTGRES_PASSWORD}@postgres:5432/renderops?sslmode=disable
      BACKEND_URL: http://control-plane:8081
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://dev-api.renderops.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY:?BETTER_AUTH_API_KEY is required}
      ORIGIN: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-renderops-dev}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Encrypts model provider credentials saved on the Secrets page.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # Agent sessions: off unless "true". The control plane's runner calls
      # /api/internal/agent-sessions/* with AGENT_WORKER_TOKEN (same value as
      # the control plane's; unset hides that API).
      AGENT_SESSIONS_ENABLED: ${AGENT_SESSIONS_ENABLED:-}
      AGENT_WORKER_TOKEN: ${AGENT_WORKER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    networks: [internal]

  platform-migrate:
    image: ghcr.io/renderops-ai/platform-migrate:latest
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://renderops:${POSTGRES_PASSWORD}@postgres:5432/renderops?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: ghcr.io/renderops-ai/caddy-cloudflare:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}
    depends_on:
      platform:
        condition: service_started
      preview-gateway:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
